<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal — sACN Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e12;
    --panel: #11171d;
    --panel-2: #161d24;
    --line: #232b33;
    --line-soft: #1a2129;
    --text: #e4e9ed;
    --text-muted: #6b7680;
    --text-dim: #454e57;
    --signal: #00d9ff;
    --signal-dim: rgba(0,217,255,0.12);
    --amber: #ff8a00;
    --danger: #ff4d4d;
    --radius: 3px;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--signal-dim);color:var(--text);}

  .app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;gap:28px;
    padding:14px 22px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:6px;}
  .brand .mark{
    width:9px;height:9px;border-radius:50%;
    background:var(--text-dim);
    box-shadow:0 0 0 3px var(--line-soft);
    transition:background .25s, box-shadow .25s;
  }
  .brand .mark.live{background:var(--signal);box-shadow:0 0 0 3px rgba(0,217,255,0.18), 0 0 10px 1px var(--signal);}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;font-size:22px;letter-spacing:0.06em;
    margin:0;color:var(--text);text-transform:uppercase;
  }
  .brand span.sub{
    font-family:var(--font-mono);font-size:11px;color:var(--text-muted);
    letter-spacing:0.04em;
  }

  .ctrl-cluster{display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;
    color:var(--text-muted);text-transform:uppercase;
  }

  /* power switch */
  .switch{
    display:flex;align-items:center;gap:10px;
    cursor:pointer;user-select:none;
    padding:7px 12px 7px 8px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  }
  .switch .track{
    width:34px;height:18px;border-radius:10px;background:#1c242c;
    border:1px solid var(--line);position:relative;transition:background .2s, border-color .2s;
  }
  .switch .knob{
    position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;
    background:var(--text-dim);transition:transform .18s ease, background .18s ease;
  }
  .switch.on .track{background:rgba(0,217,255,0.14);border-color:rgba(0,217,255,0.4);}
  .switch.on .knob{transform:translateX(16px);background:var(--signal);box-shadow:0 0 6px 0 var(--signal);}
  .switch .txt{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);letter-spacing:0.04em;}
  .switch.on .txt{color:var(--signal);}

  select, input[type=number]{
    font-family:var(--font-mono);font-size:13px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 8px;outline:none;
  }
  select:focus, input[type=number]:focus{border-color:var(--signal);}
  select{min-width:190px;}
  input[type=number]{width:64px;}
  .range-row{display:flex;align-items:flex-end;gap:8px;}
  .range-row .dash{color:var(--text-dim);padding-bottom:6px;font-family:var(--font-mono);}
  .apply-btn{
    font-family:var(--font-mono);font-size:12px;letter-spacing:0.04em;
    background:transparent;color:var(--signal);border:1px solid rgba(0,217,255,0.45);
    border-radius:var(--radius);padding:7px 12px;cursor:pointer;transition:background .15s, color .15s;
    text-transform:uppercase;height:31px;
  }
  .apply-btn:hover{background:rgba(0,217,255,0.1);}
  .apply-btn:active{background:rgba(0,217,255,0.2);}
  .range-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-left:2px;}

  /* ---------- TAB BAR ---------- */
  .tabbar{
    display:flex;align-items:center;gap:2px;
    padding:0 18px;background:var(--bg);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;cursor:pointer;
    border-bottom:2px solid transparent;
    font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);
    white-space:nowrap;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--signal);border-bottom-color:var(--signal);}
  .tab .rate{font-size:10px;color:var(--text-dim);}
  .tab.active .rate{color:rgba(0,217,255,0.6);}
  .tab .pop{
    opacity:0.35;padding:2px;border-radius:2px;line-height:0;
  }
  .tab .pop:hover{opacity:1;background:var(--line-soft);}
  .tab .pop svg{display:block;width:11px;height:11px;}

  /* ---------- STATUS STRIP ---------- */
  .status-strip{
    display:flex;gap:22px;align-items:center;
    padding:9px 22px;background:var(--panel);
    border-bottom:1px solid var(--line);
    font-family:var(--font-mono);font-size:11px;color:var(--text-muted);
  }
  .status-strip b{color:var(--text);font-weight:500;}
  .status-strip .dot{color:var(--text-dim);}

  /* ---------- GRID ---------- */
  .grid-wrap{flex:1;padding:20px;overflow:auto;position:relative;}
  .dmx-grid{
    border-collapse:collapse;font-family:var(--font-mono);
    background:var(--panel);border:1px solid var(--line);
  }
  .dmx-grid td, .dmx-grid th{
    border:1px solid var(--line-soft);
    text-align:center;padding:0;
    width:58px;height:34px;
  }
  .dmx-grid th{
    background:var(--panel-2);color:var(--text-muted);
    font-size:11px;font-weight:500;letter-spacing:0.03em;
  }
  .dmx-grid th.corner{background:var(--panel);color:var(--text-dim);font-size:10px;}
  .row-label{
    background:var(--panel-2)!important;color:var(--text-muted);
    font-size:10px;letter-spacing:0.02em;
  }
  .cell{
    position:relative;font-size:13px;font-weight:500;color:var(--text);
    transition:background-color .12s linear, color .12s linear;
  }
  .cell .val{position:relative;z-index:1;}
  .cell.empty{color:var(--text-dim);background:var(--bg)!important;}
  .cell.empty .val{opacity:0.3;}

  .grid-offline .cell:not(.empty){background:var(--panel)!important;color:var(--text-dim)!important;}
  .grid-offline{position:relative;}
  .offline-veil{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,14,18,0.55);backdrop-filter:blur(1px);
    font-family:var(--font-mono);font-size:12px;color:var(--text-muted);
    letter-spacing:0.04em;text-transform:uppercase;
  }

  /* ---------- FLOATING WINDOWS ---------- */
  .floater{
    position:fixed;top:120px;left:120px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 12px 40px rgba(0,0,0,0.55);
    z-index:100;min-width:340px;
    display:flex;flex-direction:column;
    max-height:80vh;
  }
  .floater-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;background:var(--panel-2);
    border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;
    cursor:grab;font-family:var(--font-mono);font-size:12px;color:var(--signal);
    letter-spacing:0.04em;
  }
  .floater-head:active{cursor:grabbing;}
  .floater-head .close{
    color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:2px;
  }
  .floater-head .close:hover{color:var(--danger);background:rgba(255,77,77,0.1);}
  .floater-body{overflow:auto;padding:12px;}
  .floater .dmx-grid td, .floater .dmx-grid th{width:40px;height:26px;font-size:11px;}
  .floater .row-label{font-size:9px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark" id="liveMark"></div>
      <h1>Signal</h1>
      <span class="sub">sACN / DMX MONITOR</span>
    </div>

    <div class="ctrl-cluster">
      <div class="field">
        <label>sACN listening</label>
        <div class="switch" id="powerSwitch">
          <div class="track"><div class="knob"></div></div>
          <span class="txt" id="powerTxt">Stopped</span>
        </div>
      </div>

      <div class="field">
        <label>Network adapter</label>
        <select id="adapterSelect">
          <option value="loopback">Loopback (127.0.0.1)</option>
          <option value="wifi">en0 — Wi-Fi (192.168.1.42)</option>
          <option value="eth">en1 — Ethernet (10.0.0.15)</option>
          <option value="usb">en2 — USB-C LAN (169.254.8.3)</option>
        </select>
      </div>

      <div class="field">
        <label>Universe range</label>
        <div class="range-row">
          <input type="number" id="rangeStart" min="1" max="999" value="1">
          <span class="dash">–</span>
          <input type="number" id="rangeEnd" min="1" max="999" value="4">
          <button class="apply-btn" id="applyRange">Apply</button>
        </div>
      </div>
      <div class="range-note" id="rangeNote">&nbsp;</div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="status-strip">
    <span>Universe <b id="statusUniverse">1</b></span>
    <span class="dot">•</span>
    <span><b id="statusChans">512</b>/512 channels</span>
    <span class="dot">•</span>
    <span id="statusRate">no signal</span>
    <span class="dot">•</span>
    <span id="statusAdapter">Loopback (127.0.0.1)</span>
  </div>

  <main class="grid-wrap">
    <div id="mainGridHolder"></div>
  </main>

</div>

<div id="floatingLayer"></div>

<script>
(function(){
  const CH = 512, COLS = 10, ROWS = Math.ceil(CH/COLS); // 52 rows

  const state = {
    listening: false,
    adapter: 'loopback',
    rangeStart: 1,
    rangeEnd: 4,
    active: 1,
    universes: {},   // id -> Float32Array(512) current values
    phase: {},       // id -> per-channel phase seed
    floaters: {},    // id -> {el, gridEl}
    tick: 0,
    topZ: 100
  };

  const adapterLabels = {
    loopback: 'Loopback (127.0.0.1)',
    wifi: 'en0 — Wi-Fi (192.168.1.42)',
    eth: 'en1 — Ethernet (10.0.0.15)',
    usb: 'en2 — USB-C LAN (169.254.8.3)'
  };

  function ensureUniverse(id){
    if(!state.universes[id]){
      state.universes[id] = new Float32Array(CH).fill(0);
      const phases = new Float32Array(CH);
      for(let i=0;i<CH;i++) phases[i] = Math.random()*Math.PI*2;
      state.phase[id] = phases;
    }
  }

  function buildGridTable(id, compact){
    const table = document.createElement('table');
    table.className = 'dmx-grid';
    table.dataset.universe = id;

    const thead = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    corner.textContent = 'CH';
    thead.appendChild(corner);
    for(let c=1;c<=COLS;c++){
      const th = document.createElement('th');
      th.textContent = c;
      thead.appendChild(th);
    }
    table.appendChild(thead);

    for(let r=0;r<ROWS;r++){
      const tr = document.createElement('tr');
      const startCh = r*COLS+1;
      const endCh = Math.min(startCh+COLS-1, CH);
      const label = document.createElement('td');
      label.className='row-label';
      label.textContent = startCh + '–' + endCh;
      tr.appendChild(label);
      for(let c=0;c<COLS;c++){
        const chNum = r*COLS + c + 1;
        const td = document.createElement('td');
        if(chNum>CH){
          td.className = 'cell empty';
          td.innerHTML = '<span class="val">–</span>';
        } else {
          td.className = 'cell';
          td.dataset.ch = chNum-1;
          td.title = 'Channel ' + chNum;
          td.innerHTML = '<span class="val">0</span>';
        }
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    return table;
  }

  function paintGrid(table, id){
    const values = state.universes[id];
    if(!values) return;
    const cells = table.querySelectorAll('.cell:not(.empty)');
    cells.forEach(td=>{
      const ch = +td.dataset.ch;
      const v = values[ch];
      const span = td.querySelector('.val');
      span.textContent = Math.round(v);
      const alpha = (v/255) * 0.85;
      td.style.backgroundColor = `rgba(0,217,255,${alpha.toFixed(3)})`;
      td.style.color = v>140 ? '#04181c' : 'var(--text)';
      td.style.textShadow = v>40 ? `0 0 6px rgba(0,217,255,${Math.min(v/255,0.8).toFixed(2)})` : 'none';
    });
  }

  function clearGridVisual(table){
    table.querySelectorAll('.cell:not(.empty)').forEach(td=>{
      td.style.backgroundColor='';
      td.style.color='';
      td.style.textShadow='';
      td.querySelector('.val').textContent='0';
    });
  }

  // ---------- MAIN GRID ----------
  const mainHolder = document.getElementById('mainGridHolder');
  let mainTable = null;

  function renderMainGrid(){
    mainHolder.innerHTML = '';
    ensureUniverse(state.active);
    mainTable = buildGridTable(state.active, false);
    mainHolder.appendChild(mainTable);
    updateOfflineVeil();
    document.getElementById('statusUniverse').textContent = state.active;
  }

  function updateOfflineVeil(){
    const existing = mainHolder.querySelector('.offline-veil');
    if(existing) existing.remove();
    if(!state.listening){
      const veil = document.createElement('div');
      veil.className = 'offline-veil';
      veil.style.position='absolute';
      veil.textContent = 'Not listening — turn on sACN to see live DMX data';
      mainHolder.style.position='relative';
      mainHolder.appendChild(veil);
      clearGridVisual(mainTable);
    }
  }

  // ---------- TABS ----------
  const tabbar = document.getElementById('tabbar');
  function renderTabs(){
    tabbar.innerHTML = '';
    for(let u=state.rangeStart; u<=state.rangeEnd; u++){
      ensureUniverse(u);
      const tab = document.createElement('div');
      tab.className = 'tab' + (u===state.active ? ' active':'');
      tab.innerHTML = `<span>Universe ${u}</span><span class="rate">${state.listening?'44 Hz':'—'}</span>
        <span class="pop" title="Open in separate window">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M6 3H3v10h10v-3"/><path d="M9 3h4v4"/><path d="M13 3L7 9"/>
          </svg>
        </span>`;
      tab.addEventListener('click', (e)=>{
        if(e.target.closest('.pop')) return;
        state.active = u;
        renderTabs();
        renderMainGrid();
        document.getElementById('statusChans').textContent = 512;
      });
      tab.querySelector('.pop').addEventListener('click', (e)=>{
        e.stopPropagation();
        openFloater(u);
      });
      tabbar.appendChild(tab);
    }
  }

  // ---------- RANGE ----------
  document.getElementById('applyRange').addEventListener('click', ()=>{
    let s = parseInt(document.getElementById('rangeStart').value)||1;
    let e = parseInt(document.getElementById('rangeEnd').value)||1;
    if(e<s) e = s;
    if(e-s > 24){ e = s+24; document.getElementById('rangeEnd').value = e; }
    state.rangeStart = s; state.rangeEnd = e;
    if(state.active < s || state.active > e) state.active = s;
    document.getElementById('rangeNote').textContent =
      (e-s+1) + ' universe' + ((e-s+1)===1?'':'s') + ' in range (max 25 shown at once)';
    renderTabs();
    renderMainGrid();
  });

  // ---------- POWER SWITCH ----------
  const powerSwitch = document.getElementById('powerSwitch');
  const powerTxt = document.getElementById('powerTxt');
  const liveMark = document.getElementById('liveMark');
  powerSwitch.addEventListener('click', ()=>{
    state.listening = !state.listening;
    powerSwitch.classList.toggle('on', state.listening);
    powerTxt.textContent = state.listening ? 'Listening' : 'Stopped';
    liveMark.classList.toggle('live', state.listening);
    document.getElementById('statusRate').textContent = state.listening ? '44 packets/sec' : 'no signal';
    updateOfflineVeil();
    renderTabs();
  });

  // ---------- ADAPTER ----------
  document.getElementById('adapterSelect').addEventListener('change', (e)=>{
    state.adapter = e.target.value;
    document.getElementById('statusAdapter').textContent = adapterLabels[state.adapter];
  });

  // ---------- FLOATERS ----------
  const floatLayer = document.getElementById('floatingLayer');
  let cascade = 0;
  function openFloater(id){
    if(state.floaters[id]) { bringToFront(state.floaters[id].el); return; }
    ensureUniverse(id);
    const el = document.createElement('div');
    el.className = 'floater';
    el.style.top = (100 + (cascade%5)*28) + 'px';
    el.style.left = (280 + (cascade%5)*28) + 'px';
    cascade++;
    el.innerHTML = `<div class="floater-head">
        <span>Universe ${id}</span>
        <span class="close" title="Close">✕</span>
      </div>
      <div class="floater-body"></div>`;
    const table = buildGridTable(id, true);
    el.querySelector('.floater-body').appendChild(table);
    floatLayer.appendChild(el);
    state.floaters[id] = {el, table};
    bringToFront(el);

    el.querySelector('.close').addEventListener('click', ()=>{
      el.remove();
      delete state.floaters[id];
    });

    makeDraggable(el, el.querySelector('.floater-head'));
    el.addEventListener('mousedown', ()=>bringToFront(el));
    if(!state.listening) clearGridVisual(table);
  }

  function bringToFront(el){
    state.topZ += 1;
    el.style.zIndex = state.topZ;
  }

  function makeDraggable(el, handle){
    let dragging=false, offX=0, offY=0;
    handle.addEventListener('mousedown', (e)=>{
      dragging = true;
      const rect = el.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e)=>{
      if(!dragging) return;
      el.style.left = Math.max(0, e.clientX - offX) + 'px';
      el.style.top = Math.max(0, e.clientY - offY) + 'px';
    });
    document.addEventListener('mouseup', ()=>{ dragging=false; });
  }

  // ---------- SIMULATION ----------
  function tick(){
    state.tick += 1;
    if(state.listening){
      const t = state.tick * 0.06;
      // update active universe + any open floaters
      const idsToUpdate = new Set([state.active, ...Object.keys(state.floaters).map(Number)]);
      idsToUpdate.forEach(id=>{
        ensureUniverse(id);
        const values = state.universes[id];
        const phases = state.phase[id];
        for(let i=0;i<CH;i++){
          const speed = 0.6 + (i%7)*0.05;
          const wave = 128 + 127*Math.sin(t*speed + phases[i] + id*0.7);
          values[i] = Math.max(0, Math.min(255, wave));
        }
        if(id===state.active && mainTable) paintGrid(mainTable, id);
        if(state.floaters[id]) paintGrid(state.floaters[id].table, id);
      });
    }
  }
  setInterval(tick, 130);

  // ---------- INIT ----------
  document.getElementById('rangeNote').textContent = '4 universes in range (max 25 shown at once)';
  renderTabs();
  renderMainGrid();
})();
</script>

</body>
</html>
